name: Cross-platform checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.403'
      - run: dotnet build AiGuardLock.CrossPlatform.slnx -c Release
      - run: dotnet run --project tests/AiGuardLock.CrossPlatform.Tests -c Release --no-build
